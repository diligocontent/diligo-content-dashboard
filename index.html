 const mx=Math.max(...entries.map(x=>x[1][key]||0),1);
 return `<div class="barList">${entries.map(([n,v])=>`<div class="barRow"><div class="barName">${n}</div><div class="barTrack"><i style="width:${Math.max(2,(v[key]||0)/mx*100)}%"></i></div><b>${key==='gmv'?F.money(v[key]||0):F.n(v[key]||0)}</b></div>`).join('')}</div>`
}
function aggregateTypes(records){
 const out={};
 records.forEach(x=>{
   const k=x.type||'Khác'; if(!out[k])out[k]={videos:0,views:0,engagement:0,clicks:0,orders:0,gmv:0,commerce_known:0};
   const g=out[k]; g.videos++;g.views+=x.views||0;g.engagement+=x.engagement||0;
   if(x.clicks!=null){g.clicks+=x.clicks||0;g.orders+=x.orders||0;g.gmv+=x.gmv||0;g.commerce_known++}
 });
 Object.values(out).forEach(g=>{g.avg_views=safeDiv(g.views,g.videos);g.er=safeDiv(g.engagement,g.views)});
 return out;
}
function allContentRecords(d=DATA){

 return [...tt,...sh,...za];
}

  tt:{views:tv,engagement:te,er:safeDiv(te,tv),clicks:a.tiktok.total.clicks+b.tiktok.total.clicks,orders:a.tiktok.total.orders+b.tiktok.total.orders,gmv:a.tiktok.total.gmv+b.tiktok.total.gmv},
  sh:{views:a.shopee.self_upload.week_views+b.shopee.self_upload.week_views,clicks:a.shopee.self_upload.known_clicks+b.shopee.self_upload.known_clicks,orders:a.shopee.self_upload.known_orders+b.shopee.self_upload.known_orders,gmv:a.shopee.self_upload.known_gmv+b.shopee.self_upload.known_gmv},
  za:{views:a.zalo.overview.views+b.zalo.overview.views,engagement:a.zalo.overview.engagement+b.zalo.overview.engagement,posts:a.zalo.overview.posted_videos+b.zalo.overview.posted_videos,net:a.zalo.overview.net_followers+b.zalo.overview.net_followers},
  fol:{Lipzo:b.tiktok.followers.Lipzo.end-a.tiktok.followers.Lipzo.start,Niva:b.tiktok.followers.Niva.end-a.tiktok.followers.Niva.start}
 };
}

  ${kpi('Shopee self-upload',F.n(m.sh.views)+' views',`${F.n(m.sh.orders)} đơn · ${F.money(m.sh.gmv)} DT đơn đặt đã xác minh`)}
  ${kpi('Zalo OA Views lũy kế',F.n(m.za.views),`${F.n(m.za.posts)} video · follower ròng +${F.n(m.za.net)}`)}

 ${card('Hai tuần đã có dữ liệu','10–16 và 17–23 là hai kỳ liền nhau, có thể so WoW trực tiếp.',
 `<div class="monthWeeks">
  <div class="weekCard"><h3>10–16/09 · hoàn chỉnh</h3>
   <div class="weekMetric"><span>TikTok Views</span><b>${F.n(a.tiktok.total.views)}</b></div>
   <div class="weekMetric"><span>TikTok ER</span><b>${F.pct(a.tiktok.total.er)}</b></div>
   <div class="weekMetric"><span>TikTok GMV video</span><b>${F.money(a.tiktok.total.gmv)}</b></div>
   <div class="weekMetric"><span>Shopee self-upload Views</span><b>${F.n(a.shopee.self_upload.week_views)}</b></div>
   <div class="weekMetric"><span>Zalo Views</span><b>${F.n(a.zalo.overview.views)}</b></div>
  </div>
  <div class="weekCard"><h3>17–23/09 · hoàn chỉnh</h3>
   <div class="weekMetric"><span>TikTok Views</span><b>${F.n(b.tiktok.total.views)} ${delta(safeDiv(b.tiktok.total.views-a.tiktok.total.views,a.tiktok.total.views))}</b></div>
   <div class="weekMetric"><span>TikTok ER</span><b>${F.pct(b.tiktok.total.er)} ${delta(safeDiv(b.tiktok.total.er-a.tiktok.total.er,a.tiktok.total.er))}</b></div>
   <div class="weekMetric"><span>TikTok GMV video</span><b>${F.money(b.tiktok.total.gmv)} ${delta(safeDiv(b.tiktok.total.gmv-a.tiktok.total.gmv,a.tiktok.total.gmv))}</b></div>
   <div class="weekMetric"><span>Shopee self-upload Views</span><b>${F.n(b.shopee.self_upload.week_views)}</b></div>
   <div class="weekMetric"><span>Zalo Views</span><b>${F.n(b.zalo.overview.views)} ${delta(safeDiv(b.zalo.overview.views-a.zalo.overview.views,a.zalo.overview.views))}</b></div>
  </div>
 </div>`)}
 ${card('Follower TikTok · 10–23/09','Tính từ follower đầu kỳ 10/09 đến cuối 23/09, không cộng follower tổng từng tuần.',
 metricList([['Lipzo',`${a.tiktok.followers.Lipzo.start} → ${b.tiktok.followers.Lipzo.end} · ${m.fol.Lipzo>=0?'+':''}${F.n(m.fol.Lipzo)}`],['Niva',`${a.tiktok.followers.Niva.start} → ${b.tiktok.followers.Niva.end} · ${m.fol.Niva>=0?'+':''}${F.n(m.fol.Niva)}`]]))}
 ${(()=>{
   const mr=[...allContentRecords(a),...allContentRecords(b)];
   const mt=aggregateTypes(mr);
   const top=mr.slice().sort((x,y)=>(y.views||0)-(x.views||0)).slice(0,10)
     .map((x,i)=>[i+1,platformBadge(x.platform),brandBadge(x.brand),F.date(x.date),`<div class="tableTitle">${F.short(x.title,95)}</div>`,x.type,x.product,F.n(x.views),F.pct(x.er||0)]);
   return `<div class="grid2 section">
     ${card('Content lũy kế 10–23/09','Gộp record chi tiết của hai kỳ; không thay cho KPI kênh.',miniBars(mt,'views'))}
     ${card('Top video lũy kế theo View','Dựa trên snapshot/record chi tiết của từng kỳ.',table(['#','Nền tảng','Nhãn','Ngày','Video','Loại content','Sản phẩm','View','ER'],top,['num','','','','','','','num','num']))}
   </div>`;
 })()}
 <div class="note oknote">TikTok Content tuần 17–23 đã được bổ sung. Snapshot ngày 25/09 có 7 record đăng trong kỳ (Lipzo 5, Niva 2); đây là tập record hiện có trong snapshot, không phải publishing log tuyệt đối.</div>
 `;
}

  <div class="insight"><b>6. Zalo OA</b><p>Zalo đạt <b>${F.n(z.views)} views</b>, ER <b>${F.pct(z.er)}</b>, ${F.n(z.posted_videos)} video đăng trong kỳ và follower ròng ${z.net_followers>=0?'+':''}${F.n(z.net_followers)}.</p></div>
  <div class="insight"><b>7. Giới hạn dữ liệu</b><p>${DATA.meta.content_status==='pending'?'Hai file TikTok Content 17–23 chưa có, nên chưa kết luận Top video/loại content TikTok tuần này.':'TikTok Content là snapshot, không phải publishing log tuyệt đối.'} Seller vẫn có thể chứa video đăng trước kỳ nếu tạo commerce trong kỳ.</p></div>
  <div class="insight"><b>8. Hành động kỳ tới</b><p>Giữ lịch tuần liền nhau; tiếp tục tách KPI kênh – Content snapshot – commerce attribution; Shopee ưu tiên hook 1–2 giây đầu; TikTok có thể tiếp tục test khung 19–20h dựa trên follower activity.</p></div>
 </div></div>`;

function renderAll(){
 DATA=PERIODS[document.getElementById('periodFilter').value];
 document.getElementById('periodChip').textContent=DATA.meta.content_status==='pending'?'17–23/09 · TikTok Content chờ 2 file':'Kỳ hoàn chỉnh';
 renderOverview();renderTikTok();renderShopee();renderZalo();renderContent();renderRanking();renderMonth();renderInsight();
}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');
 document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.dataset.page===b.dataset.page));
}));
document.getElementById('applyFilters').addEventListener('click',()=>{renderTikTok();renderContent();renderRanking()});

renderAll();
